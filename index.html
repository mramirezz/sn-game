<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <style>
    @font-face { font-family: Pixel; src: url('vendor/fonts/PressStart2P-Regular.ttf'); }
    @font-face { font-family: 'Space Mono'; font-weight: 400; src: url('vendor/fonts/SpaceMono-Regular-latin.woff2') format('woff2'); } /* la letra del juego: de máquina y legible (Mauricio, 2026-10-26) */
    @font-face { font-family: 'Space Mono'; font-weight: 700; src: url('vendor/fonts/SpaceMono-Bold-latin.woff2') format('woff2'); }
    html, body { margin: 0; height: 100%; background: #000; color: #e8ecf8; font-family: system-ui, sans-serif; overflow: hidden;
      touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    #marco { position: absolute; left: 0; top: 0; } /* lado.js lo centra; sin transform, para que los paneles fijos usen toda la pantalla */
    #vista { position: absolute; left: 0; top: 0; overflow: hidden; }
    #mundo { image-rendering: pixelated; display: block; position: absolute; top: 0; left: 0; }
    .hud { position: absolute; top: 6px; right: 6px; display: flex; gap: 6px; align-items: center; }
    button.px { font-family: 'Space Mono', ui-monospace, monospace; font-weight: 700; font-size: 13px; line-height: 1.3; color: #e8ecf8; background: rgba(8,8,16,.75); border: 2px solid #c9b48a; padding: 6px 8px; }
    .chip { font-family: 'Space Mono', ui-monospace, monospace; font-weight: 700; font-size: 12px; color: #6ee7a0; background: rgba(8,8,16,.7); border: 2px solid #2a5a3a; padding: 5px 6px; }
    #contador { position: absolute; top: 8px; left: 8px; font-family: 'Space Mono', ui-monospace, monospace; font-size: 13px; line-height: 1.45; color: #e8d8b0;
      background: rgba(8,8,16,.7); border: 2px solid #6a5a3a; padding: 4px 8px; max-width: 46%; }
    #contador b { color: #ffb84d; font-weight: 400; }
    #marco.vertical #contador { top: 42px; max-width: calc(100% - 16px); } /* en vertical, debajo de los botones */
    #contador .meta { display: block; color: #ffb84d; }
    /* el diálogo va abajo, como en los RPG: sobre el escenario al caminar y debajo del instrumento cuando hay uno abierto */
    #caja { position: absolute; left: 8px; right: 8px; bottom: 8px; display: none; gap: 10px; padding: 10px 12px; z-index: 6;
      background: linear-gradient(rgba(20,14,10,.96), rgba(10,8,8,.96)); border: 2px solid #c9b48a; box-shadow: 0 0 0 2px #000, inset 0 0 0 1px #3a2a1a; }
    body.con-panel #caja { position: fixed; bottom: 10px; left: 50%; right: auto; transform: translateX(-50%); width: min(900px, calc(100vw - 20px)); }
    body.con-panel #contador, body.con-panel .hud { display: none; }
    #retrato { width: 56px; height: 56px; flex: none; image-rendering: pixelated; border: 2px solid #6a5a3a; background: #120c0a; }
    #caja .quien { font-family: 'Space Mono', ui-monospace, monospace; font-weight: 700; font-size: 14px; margin-bottom: 6px; color: #ffb84d; }
    #caja .texto { font-family: 'Space Mono', ui-monospace, monospace; font-size: clamp(15px, 0.35vw + 13.5px, 18px); line-height: 1.45; }
    #caja .sigue { position: absolute; right: 8px; bottom: 4px; font-family: 'Space Mono', ui-monospace, monospace; font-size: 12px; animation: parpadeo 1s steps(2) infinite; }
    @keyframes parpadeo { 50% { opacity: 0; } }
    #negro { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .35s; z-index: 10; }
    /* pantalla de inicio: la escena animada en el canvas (vista.js, Titulo) y encima el título y un menú de RPG */
    #titulo { position: fixed; inset: 0; z-index: 8; overflow: hidden; background: #02030a; display: flex; align-items: center; justify-content: center; font-family: Pixel; text-align: center; --flash: 0; }
    #titulo .velo { position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(rgba(2,3,10,.55), rgba(2,3,10,0) 22%, rgba(2,3,10,0) 55%, rgba(2,3,10,.75)), radial-gradient(ellipse at 50% 45%, rgba(0,0,0,.35) 0%, rgba(0,0,0,0) 45%); }
    #cieloTitulo { position: absolute; inset: 0; width: 100%; height: 100%; }
    #titulo .tit { position: relative; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 16px; animation: entra 1.4s ease-out both; }
    @keyframes entra { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    #titulo .pre { margin: 0; font-family: 'Space Mono', ui-monospace, monospace; font-size: clamp(11px, 1.1vw, 14px); letter-spacing: .3em; color: #c9b48a; text-transform: uppercase; text-shadow: 0 2px 0 #000; } /* la pixel del título no tiene Í */
    #titulo h1 { margin: 0; font-size: clamp(22px, 5.4vw, 52px); line-height: 1.25; color: #ffb84d; font-weight: 400; letter-spacing: .05em;
      text-shadow: 3px 3px 0 #5a2a00, 6px 6px 0 rgba(0,0,0,.6), 0 0 calc(18px + 40px * var(--flash)) rgba(255,184,77,calc(.4 + .5 * var(--flash))); }
    #titulo h1 span { display: inline-block; }
    #titulo .sub { margin: 0 0 6px; font-family: 'Space Mono', ui-monospace, monospace; font-size: clamp(13px, 1.3vw, 17px); color: #e8d8b0; text-shadow: 0 2px 0 #000; }
    #titulo .menu { display: flex; flex-direction: column; gap: 4px; min-width: min(300px, 80vw); padding: 10px; background: rgba(12,9,8,.78);
      border: 2px solid #c9b48a; box-shadow: 0 0 0 2px #000, inset 0 0 0 2px #3a2a1a, 0 10px 30px rgba(0,0,0,.6); }
    #titulo .boton { position: relative; font-size: clamp(14px, 1.4vw, 17px); padding: 12px 16px 12px 34px; text-align: left; background: transparent; border: 2px solid transparent; color: #e8ecf8; cursor: pointer; }
    #titulo .boton::before { content: '▶'; position: absolute; left: 12px; color: #ffb84d; opacity: 0; }
    #titulo .boton:hover, #titulo .boton:focus-visible, #titulo .boton.activo { color: #ffb84d; background: rgba(255,184,77,.08); border-color: rgba(255,184,77,.35); outline: none; }
    #titulo .boton:hover::before, #titulo .boton:focus-visible::before, #titulo .boton.activo::before { opacity: 1; animation: parpadeo 1s steps(2) infinite; }
    #titulo .boton.chico { font-size: clamp(12px, 1.1vw, 14px); }
    #titulo .menu:hover .boton.activo:not(:hover), #titulo .menu:focus-within .boton.activo:not(:focus-visible):not(:hover) { color: #e8ecf8; background: transparent; border-color: transparent; }
    #titulo .menu:hover .boton.activo:not(:hover)::before, #titulo .menu:focus-within .boton.activo:not(:focus-visible):not(:hover)::before { opacity: 0; }
    #titulo .estado { margin: 2px 0 0; font-family: 'Space Mono', ui-monospace, monospace; font-size: 13px; color: #c9b48a; min-height: 1em; text-shadow: 0 2px 0 #000; }
    #titulo .pie-titulo { position: absolute; bottom: 10px; left: 0; right: 0; margin: 0; font-family: 'Space Mono', ui-monospace, monospace; font-size: 12px; color: rgba(232,216,176,.7); text-shadow: 0 2px 0 #000; }
    #titulo[hidden] { display: none; }
    #titulo .idioma { display: flex; gap: 8px; margin: 6px 0 0; }
    #titulo .idioma button { font-size: 12px; padding: 6px 10px; opacity: .6; }
    #titulo .idioma button.activo { opacity: 1; border-color: #ffb84d; color: #ffb84d; }
    #cuaderno { z-index: 9; } /* el cuaderno se puede abrir desde el inicio */
    /* el mando en pantalla: solo con dedo, y solo al caminar (sin diálogo ni instrumento) */
    #mando { display: none; position: absolute; left: 10px; right: 10px; bottom: 14px; justify-content: space-between; align-items: center; z-index: 5; pointer-events: none; }
    @media (pointer: coarse) { #mando { display: flex; } }
    body.con-dialogo #mando, body.con-panel #mando { display: none; }
    #mando button { pointer-events: auto; width: 64px; height: 64px; font: 24px/1 system-ui, sans-serif; border-radius: 50%; background: rgba(8,8,16,.55); touch-action: none; -webkit-user-select: none; user-select: none; }
    #mando button:active { background: rgba(255,184,77,.25); }
    /* el aviso de que se puede jugar en horizontal: solo con el teléfono vertical */
    .girar { display: none; }
    @media (orientation: portrait) { .girar { display: inline-flex; align-items: center; gap: 6px; } }
    body.girado #girar { display: inline-flex; align-items: center; gap: 6px; } /* girado: el mismo botón vuelve a vertical */
    body.girado #girar .telefono { transform: rotate(-90deg); }
    .aviso-girar { margin: 8px 0 0; font-family: system-ui, sans-serif; font-size: 13px; color: #e8d8b0; }
    .telefono { display: inline-block; width: 10px; height: 16px; border: 2px solid currentColor; border-radius: 3px; position: relative; }
    .telefono::after { content: ''; position: absolute; left: 50%; bottom: 1px; width: 2px; height: 2px; margin-left: -1px; background: currentColor; }
    .telefono.gira { width: 14px; height: 22px; animation: gira 2.4s ease-in-out infinite; }
    @keyframes gira { 0%, 30% { transform: rotate(0); } 55%, 85% { transform: rotate(-90deg); } 100% { transform: rotate(0); } }
  </style>
</head>

  <div id="marco">
    <div id="vista"><canvas id="mundo"></canvas></div>
    <div id="contador"></div>
    <div class="hud"><span class="chip" id="ciencia">0</span><button class="px" id="abrirCuaderno" data-en="Notebook">Cuaderno</button><button class="px" id="musica">♪ sí</button><button class="px girar" id="girar" title="Jugar en horizontal" data-en-title="Play in landscape">⟳ <span class="telefono"></span></button></div>

      <div class="contenido"></div>
    </section>

    <div id="caja"><canvas id="retrato" width="56" height="56"></canvas><div><div class="quien"></div><div class="texto"></div></div><span class="sigue">▼</span></div>
    <div id="negro"></div>
    <div id="titulo">
      <canvas id="cieloTitulo"></canvas><div class="velo"></div>
      <div class="tit">
        <p class="pre" data-en="an astronomy adventure">una aventura de astronomía</p>
        <h1><span>SN</span> <span>RATES</span></h1>
        <p class="sub" data-en="How many supernovae explode in the universe, and how we know">Cuántas supernovas explotan en el universo, y cómo se sabe</p>
        <nav class="menu" aria-label="Menú" data-en-aria="Menu">
          <button class="px boton" id="continuar" hidden data-en="Continue">Continuar</button>

          <button class="px boton chico" id="tituloCuaderno" hidden data-en="Notebook">Cuaderno</button>
        </nav>
        <p class="estado" id="tituloEstado"></p>
        <p class="girar aviso-girar" data-en="&lt;span class=&quot;telefono gira&quot;&gt;&lt;/span&gt;You can also play in landscape: turn your phone"><span class="telefono gira"></span>También se juega en horizontal: gira el teléfono</p>
        <p class="idioma"><button class="px" data-idioma="es">Español</button><button class="px" data-idioma="en">English</button></p>
      </div>
      <p class="pie-titulo" data-en="8 chapters · 24 missions · from counting supernovae to the rate in a thesis">8 capítulos · 24 misiones · de contar supernovas a la tasa de una tesis</p>
    </div>
  </div>
